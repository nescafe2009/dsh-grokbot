<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grokbot · D / 角色动作设计样稿</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;color:#202120;background:#fff;font-synthesis:none;--line:#e9eae7;--muted:#737671}*{box-sizing:border-box}body{margin:0}button,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}button:focus-visible,select:focus-visible{outline:2px solid #262b28;outline-offset:4px}button:hover{background:#f5f5f3}aside{position:fixed;inset:0 auto 0 0;width:224px;background:#f6f6f4;padding:28px 16px;display:flex;flex-direction:column;z-index:1}.brand{font-size:23px;font-weight:750;letter-spacing:-1px;margin:12px 7px 27px}.search{font-size:13px;color:var(--muted);padding:12px 10px;margin-bottom:25px}.label{font-size:12px;color:var(--muted);letter-spacing:.04em}.side-label{padding:0 10px 10px}.sidebot{display:flex;gap:10px;align-items:center;text-align:left;width:100%;padding:8px;border-radius:10px;min-height:66px}.sidebot[data-selected=true]{background:#eaece8}.name{font-size:14px;font-weight:600}.role{font-size:12px;color:var(--muted);margin-top:5px}.side-bottom{margin-top:auto;display:flex;justify-content:space-between;font-size:12px;border-top:1px solid var(--line);padding:20px 8px 95px}.group{font-size:12px;border-top:1px solid var(--line);margin-top:12px;padding:18px 8px;line-height:1.8}.group i{display:inline-block;width:7px;height:7px;background:#93a393;border-radius:50%;margin-right:8px}main{margin-left:224px;padding:110px 60px 200px;min-height:100vh}.home{max-width:660px;margin:auto}.eyebrow{font-size:10px;font-weight:600;letter-spacing:4px;color:#797d79}h1{font-size:34px;letter-spacing:-1.2px;font-weight:600;margin:20px 0 15px}.intro{font-size:17px;color:var(--muted);margin-bottom:42px}.chief{display:flex;gap:20px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0 27px}.chief .name{font-size:19px}.chief .role{font-size:14px}.arrow{width:43px;height:43px;background:#202320;color:white;border-radius:50%;font-size:24px;margin-left:auto}.arrow:hover{background:#414641}.team-label{display:flex;justify-content:space-between;margin:28px 0 23px}.team-label span:last-child{font-size:11px}.team{display:grid;grid-template-columns:1fr 1fr;gap:18px 34px}.member{display:flex;gap:14px;align-items:center;padding:9px 7px 9px 0;text-align:left;border-radius:10px}.member[aria-pressed=true]{background:#f6f7f4}.member .name{font-size:15px}.member .role{font-size:12px}.note{margin-top:28px;font-size:12px;color:var(--muted);line-height:1.8;max-width:590px}.badge{position:absolute;right:28px;top:25px;font-size:11px;letter-spacing:1px;color:#7b7f79}.studio{position:fixed;bottom:0;left:0;right:0;background:#fafbf9;border-top:1px solid #e3e5df;z-index:3;padding:14px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}.studio strong{font-size:12px}.studio small{font-size:10px;color:var(--muted)}.controls{display:flex;gap:5px;flex-wrap:wrap}.controls button{border-radius:7px;font-size:12px;padding:9px 11px}.controls button[aria-pressed=true]{background:#242924;color:white}.studio select{border:1px solid #d9ddd5;background:#fff;border-radius:6px;padding:7px;font-size:12px}.sizes{display:flex;align-items:center;gap:5px;margin-left:auto}.sizes small{width:40px}.sample{display:flex;flex-direction:column;align-items:center;min-width:35px}.sample .character{width:var(--size);height:var(--size)}.sample small{width:auto;text-align:center;font-size:9px}.live{font-size:11px;color:#6f766c;min-width:150px}
.character{width:var(--size,56px);height:var(--size,56px);display:inline-block;flex:none;overflow:visible}.character svg{display:block;width:100%;height:100%;overflow:visible}.body,.eyes,.blink,.hand,.ground,.signal{transform-box:view-box;transform-origin:32px 48px}.eyes{transform-origin:32px 32px}.blink{transform-origin:32px 31px}.hand{opacity:0;transform-origin:32px 42px}.ground{opacity:.09;transform-origin:32px 57px}.signal{opacity:0;transform-origin:52px 14px}.character[data-state=idle] .blink{animation:blink 6.7s infinite}.character[data-state=idle] .body{animation:settle 7s ease-in-out infinite}.character[data-state=thinking] .body{animation:ponder 3.1s ease-in-out infinite}.character[data-state=thinking] .eyes{animation:look 3.1s ease-in-out infinite}.character[data-state=thinking] .blink{animation:blink 4.3s infinite}.character[data-state=working] .body{animation:work var(--pace,1.6s) ease-in-out infinite}.character[data-state=working] .eyes{animation:scan 2s ease-in-out infinite}.character[data-state=working] .hand{opacity:1;animation:tap .48s ease-in-out infinite alternate}.character[data-state=working] .hand.right{animation-delay:-.35s}.character[data-personality=architect][data-state=working] .body{animation:ponder 2.6s ease-in-out infinite}.character[data-personality=qa][data-state=working] .eyes{animation:scan .95s ease-in-out infinite}.character[data-personality=chief][data-state=working] .body{animation:coordinate 2.3s ease-in-out infinite}.character[data-state=waiting] .body{animation:attend 6s ease-in-out 1}.character[data-state=waiting] .signal{opacity:1}.character[data-state=waiting] .blink{animation:blink 5s infinite}.character[data-state=done] .body{animation:celebrate 1.05s ease-out 1}.character[data-state=done] .signal{opacity:1}.character[data-state=error] .body{animation:shake .5s ease-out 1}.character[data-state=error] .signal{opacity:1}.character[data-state=paused] .eyes{transform:translateY(2px) scaleY(.55)}.character[data-state=paused] .body{transform:translateY(2px)}.character[data-state=unknown] svg{opacity:.6}.character[data-state=greet] .body{animation:greet 1.15s ease-out 1}.character[data-state=greet] .hand.right{opacity:1;animation:wave 1.15s ease-out 1}.character[data-surface=small] .hand,.character[data-surface=small] .ground{display:none}.character[data-surface=small] .signal{transform:scale(.8)}
@keyframes blink{0%,40%,44%,100%{transform:scaleY(1)}42%{transform:scaleY(.08)}}@keyframes settle{0%,63%,100%{transform:none}68%{transform:translateY(-1.5px) scale(1.02,.98)}74%{transform:none}}@keyframes ponder{0%,100%{transform:rotate(0)}25%,65%{transform:rotate(-9deg) translateY(-2px)}80%{transform:rotate(3deg)}}@keyframes look{0%,100%{transform:none}25%,65%{transform:translate(3px,-3px)}80%{transform:translate(-2px,0)}}@keyframes scan{0%,100%{transform:translate(-3px,1px)}50%{transform:translate(3px,1px)}}@keyframes work{0%,100%{transform:translateY(1px) scale(1.04,.96)}25%{transform:translate(-2px,-3px) rotate(-5deg)}50%{transform:translateY(1px) scale(1.04,.96)}75%{transform:translate(2px,-3px) rotate(5deg)}}@keyframes coordinate{0%,100%{transform:none}20%{transform:rotate(-8deg)}40%{transform:none}65%{transform:rotate(8deg) translateY(-2px)}80%{transform:scale(1.06,.94)}}@keyframes tap{from{transform:translateY(2px)}to{transform:translateY(-4px)}}@keyframes attend{0%,10%,100%{transform:none}3%,7%{transform:translateY(-4px) rotate(5deg)}5%{transform:none}}@keyframes celebrate{0%{transform:none}15%{transform:scale(1.15,.85)}45%{transform:translateY(-11px) rotate(-10deg) scale(.94,1.06)}70%{transform:translateY(1px) scale(1.13,.87)}85%{transform:translateY(-3px)}100%{transform:none}}@keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-4px) rotate(-5deg)}40%,80%{transform:translateX(4px) rotate(5deg)}}@keyframes greet{0%,100%{transform:none}30%{transform:translateY(-5px) rotate(-8deg)}65%{transform:rotate(6deg)}}@keyframes wave{0%,100%{transform:none}25%,65%{transform:translateY(-12px) rotate(-14deg)}45%,80%{transform:translateY(-9px) rotate(4deg)}}
body[data-motion=quiet] .character[data-state=idle] .body{animation:none}body[data-motion=quiet] .character[data-surface=small] *{animation:none!important}body[data-motion=off] .character *,body[data-hidden=true] .character *{animation:none!important}.character[data-static=true] *{animation:none!important}body[data-motion=off] .hand{display:none}@media(prefers-reduced-motion:reduce){.character *{animation:none!important}.hand{display:none}}@media(max-width:1000px){aside{width:180px}.sidebot{gap:4px}.sidebot .character{width:36px;height:36px}.side-bottom{padding-bottom:140px}main{margin-left:180px;padding:95px 32px 230px}h1{font-size:29px}.studio{gap:12px}.sizes{margin-left:0}}@media(max-width:650px){aside{display:none}main{margin-left:0;padding:75px 24px 275px}.team{gap:14px}.badge{font-size:9px}.sizes{display:none}h1{font-size:27px}.studio{padding:12px}.intro{font-size:15px}}
</style><body data-motion="standard"><aside><div class="brand">Grokbot</div><div class="search">⌕　搜索会话</div><div class="side-label label">会话</div><nav id="sidebar"></nav><div class="group"><i></i>菜单栏网速监控工具项目组<br><span class="label">　 4 位成员 · 示例项目</span></div><div class="side-bottom"><span>▱ Computer</span><span>◷　⚙</span></div></aside><div class="badge">D / CHARACTER STUDY · 动态设计样稿</div><main><section class="home"><div class="eyebrow">GROKBOT / TEAM</div><h1>今天，一起做点什么。</h1><div class="intro">你的团队已就位。</div><div class="chief" id="chief"></div><div class="team-label label"><span>团队</span><span>点击角色，预览他的动作 ↗</span></div><div class="team" id="team"></div><div class="note" id="explanation" aria-live="polite"></div></section></main><section class="studio" aria-label="动效样稿控制台"><div><strong>动作试映</strong><br><small>模拟状态 · 不执行任务</small></div><div class="controls" id="states"></div><label><select id="motion" aria-label="动作强度"><option value="standard">标准动作</option><option value="quiet">安静模式</option><option value="off">关闭动作</option></select></label><div class="sizes" id="sizes"></div><div class="live" id="status" aria-live="polite"></div></section><script>
const roles=[{id:'chief',name:'幕僚长',role:'项目统筹',color:'#06C674',shape:0,personality:'chief',pace:2.3},{id:'architect',name:'林一舟',role:'架构设计',color:'#BA855B',shape:2,personality:'architect',pace:2.6},{id:'harmony',name:'陈沐',role:'鸿蒙开发',color:'#15BBAE',shape:1,personality:'developer',pace:1.4},{id:'mac',name:'苏晚',role:'macOS 开发',color:'#FFAE32',shape:2,personality:'developer',pace:1.8},{id:'windows',name:'顾行洲',role:'Windows 开发',color:'#FF50AB',shape:3,personality:'developer',pace:1.6},{id:'qa',name:'白泽',role:'质量验证',color:'#A679F5',shape:0,personality:'qa',pace:1.9}];
const shapes=['M8 33C8 23 15 17 25 17h15c11 0 17 6 17 16s-7 16-18 16H24C14 49 8 43 8 33Z','M54 31c4 14-4 24-19 25C20 57 9 48 9 34 8 19 17 8 31 9c13 0 20 9 23 22Z','M17 20c0-8 11-12 17-5 8-5 18 2 17 11 10 7 7 20-3 23-5 8-16 9-23 4-12 3-20-5-18-14-2-8 2-15 10-19Z','M25 11c3-5 10-5 13 1l19 34c3 6 0 10-7 10H14c-7 0-10-5-7-11Z'];
const states={idle:['待命','偶尔眨眼、舒展一下；保持安静，不假装在工作。'],thinking:['思考','身体偏向一侧，目光抬起；有明确的思考姿态。'],working:['工作','身体与目光分开动作；开发角色敲击、架构师观察、幕僚长转向协调。'],waiting:['等你','轻轻探身提醒，随后安静等待；保留问号与文字。'],done:['完成','弹起、落地、收稳，一次动作后停下；不会一直庆祝。'],error:['受阻','短暂摇头后停下，保留感叹号；清楚提醒，不持续催促。'],paused:['暂停','放松身体、收起动作；暂停不表现为失败。'],unknown:['未同步','状态未知时保持静态，不能用动画假装仍在推进。']};
let selected='chief',state='working',greetTimer=null;
function character(r,size,s,staticPose=false){const y=r.shape===3?35:29;return `<span class="character" data-role="${r.id}" data-state="${s}" data-personality="${r.personality}" data-surface="${size<=36?'small':'large'}" data-static="${staticPose}" style="--size:${size}px;--pace:${r.pace}s" role="img" aria-label="${r.name}：${states[s]?.[0]||'打招呼'}"><svg viewBox="0 0 64 64" aria-hidden="true"><ellipse class="ground" cx="32" cy="59" rx="17" ry="2"/><g class="body"><path d="${shapes[r.shape]}" fill="${r.color}"/><g class="eyes"><g class="blink"><path d="M26 ${y}l2 5m10-5 2 5" fill="none" stroke="white" stroke-width="4.5" stroke-linecap="round"/></g></g><ellipse class="hand" cx="12" cy="46" rx="4.5" ry="3" fill="${r.color}"/><ellipse class="hand right" cx="53" cy="46" rx="4.5" ry="3" fill="${r.color}"/></g><g class="signal"><circle cx="54" cy="12" r="7" fill="${s==='error'?'#a44530':s==='waiting'?'#8b6a24':'#307842'}"/><text x="54" y="15.7" font-size="11" font-family="sans-serif" fill="white" text-anchor="middle">${s==='error'?'!':s==='waiting'?'?':'✓'}</text></g></svg></span>`}
function redraw(){const current=roles.find(r=>r.id===selected);document.getElementById('sidebar').innerHTML=roles.map(r=>`<button class="sidebot" data-select="${r.id}" data-selected="${r.id===selected}">${character(r,40,r.id===selected?state:'idle',true)}<span><div class="name">${r.name}</div><div class="role">${r.id===selected?states[state][0]:r.role}</div></span></button>`).join('');const chief=roles[0];document.getElementById('chief').innerHTML=character(chief,64,selected==='chief'?state:'idle',selected!=='chief')+`<div><div class="name">幕僚长</div><div class="role">${selected==='chief'?states[state][0]+' · '+(state==='working'?'协调团队中':'动作示意'):'把想法交给我。'}</div></div><button class="arrow" data-select="chief" aria-label="预览幕僚长动作">→</button>`;document.getElementById('team').innerHTML=roles.slice(1).map(r=>`<button class="member" data-select="${r.id}" aria-pressed="${r.id===selected}">${character(r,52,r.id===selected?state:'idle',r.id!==selected)}<span><div class="name">${r.name}</div><div class="role">${r.id===selected?states[state][0]+' · '+r.role:r.role}</div></span></button>`).join('');document.getElementById('states').innerHTML=Object.entries(states).map(([key,v])=>`<button data-state-button="${key}" aria-pressed="${state===key}">${v[0]}</button>`).join('')+'<button id="greet">打招呼 ↗</button>';document.getElementById('sizes').innerHTML=[32,48,80].map(size=>`<div class="sample">${character(current,size,state)}<small>${size}px</small></div>`).join('');document.getElementById('explanation').textContent=states[state][1];document.getElementById('status').textContent=current.name+' / '+states[state][0];}
document.addEventListener('click',e=>{const pick=e.target.closest('[data-select]'),change=e.target.closest('[data-state-button]');if(pick||change){clearTimeout(greetTimer);if(pick)selected=pick.dataset.select;if(change)state=change.dataset.stateButton;redraw();}if(e.target.closest('#greet')){clearTimeout(greetTimer);document.querySelectorAll(`.character[data-role="${selected}"]:not([data-static=true])`).forEach(el=>el.dataset.state='greet');greetTimer=setTimeout(redraw,1200);}});document.getElementById('motion').addEventListener('change',e=>document.body.dataset.motion=e.target.value);document.addEventListener('visibilitychange',()=>document.body.dataset.hidden=String(document.hidden));redraw();
</script></body></html>
